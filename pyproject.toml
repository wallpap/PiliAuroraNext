[project]
name = "piliauroranext-tooling"
version = "0.1.0"
description = "Python environment for PiliAuroraNext maintenance probes."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pillow==13.0.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "public-pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
required-version = "==0.17.5"
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F"]
