name: Build Android and Windows x64

on:
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android APK"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Windows x64"
                required: false
                default: true
                type: boolean

            skip_ci_tests:
                description: "Skip host CI and Windows installer tests for this build"
                required: false
                default: false
                type: boolean

            tag:
                description: "Release tag; empty only uploads workflow artifacts"
                required: false
                default: ""
                type: string

            draft_release:
                description: "Keep uploaded release assets in a draft until final verification"
                required: false
                default: false
                type: boolean

            prerelease:
                description: "Mark the release as a prerelease"
                required: false
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    prepare:
        name: Generate release metadata
        if: ${{ inputs.build_android || inputs.build_win_x64 }}
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.metadata.outputs.version }}
            json: ${{ steps.metadata.outputs.json }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Read version and build info
              id: metadata
              shell: pwsh
              env:
                  RELEASE_VERSION: ${{ inputs.tag }}
              run: |
                  $metadata = lib/scripts/build.ps1 -Version $env:RELEASE_VERSION -MetadataOnly
                  Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($metadata['pili.name'])+$($metadata['pili.code'])"
                  Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "json=$($metadata | ConvertTo-Json -Compress)"

    linux_tests:
        name: Linux release tests
        if: ${{ inputs.build_android && !inputs.skip_ci_tests }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-java@v5
              with:
                  distribution: zulu
                  java-version: "25"

            - uses: ./.github/actions/prepare-release
              with:
                  platform: android

            - name: Run Linux host CI tests
              shell: pwsh
              run: pwsh -NoProfile -File tool/run-ci-tests.ps1 -FlutterTool path

    windows_tests:
        name: Windows release tests
        if: ${{ inputs.build_win_x64 && !inputs.skip_ci_tests }}
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: ./.github/actions/prepare-release
              with:
                  platform: windows

            - name: Run Windows host CI tests
              shell: pwsh
              env:
                  BUILD_ANDROID: ${{ inputs.build_android }}
              run: tool/run-ci-tests.ps1 -FlutterTool path -PlatformOnly:($env:BUILD_ANDROID -eq 'true')

            - uses: actions/setup-python@v6
              with:
                  python-version-file: .python-version

            - uses: ./.github/actions/setup-inno

            - name: Test Windows upgrade installation
              run: python -m unittest discover -s tool/packaging -p '*_test.py' -v

    android:
        needs: prepare
        if: ${{ inputs.build_android }}
        name: Release Android (${{ matrix.abi }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - abi: armeabi-v7a
                      arch: arm
                    - abi: arm64-v8a
                      arch: arm64
                    - abi: x86_64
                      arch: x64
        env:
            # CI 不复用目录监听状态，避免 Linux runner 重复注册同一路径。
            GRADLE_OPTS: "--enable-native-access=ALL-UNNAMED -Dorg.gradle.vfs.watch=false -Dorg.gradle.caching=true"
            APK: PiliAuroraNext_android_${{ needs.prepare.outputs.version }}_${{ matrix.abi }}.apk

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "25"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/**/*.gradle*
                      android/gradle.properties
                      android/**/gradle-wrapper.properties
                      android/gradle/gradle-daemon-jvm.properties
                      third_party/**/*.gradle*
                      pubspec.lock

            - uses: ./.github/actions/prepare-release
              with:
                  platform: android

            - name: Write signing key
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  set -euo pipefail

                  : "${SIGN_KEYSTORE_BASE64:?SIGN_KEYSTORE_BASE64 is missing}"
                  : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD is missing}"
                  : "${KEY_ALIAS:?KEY_ALIAS is missing}"
                  : "${KEY_PASSWORD:?KEY_PASSWORD is missing}"
                  umask 077
                  printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  test -s android/app/key.jks
                  printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
                    "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

            # 插件将原生 JAR 下载到项目 build 目录，不在 Gradle 用户缓存内。
            - name: Cache Android libmpv archives
              uses: actions/cache@v5
              with:
                  path: build/media_kit_libs_android_video/20*/*.jar
                  key: android-libmpv-${{ hashFiles('third_party/media_kit_libs_android_video/android/build.gradle') }}

            - name: Build release APK with verified prebuilt engines
              shell: pwsh
              env:
                  ABI: ${{ matrix.abi }}
                  ARCH: ${{ matrix.arch }}
                  RELEASE_METADATA: ${{ needs.prepare.outputs.json }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  $metadata = $env:RELEASE_METADATA | ConvertFrom-Json -AsHashtable
                  $defines = @($metadata.GetEnumerator() | ForEach-Object { "--dart-define=$($_.Key)=$($_.Value)" })
                  $engine = "build/prebuilt-engine/android-$env:ARCH"
                  python third_party/flutter_engine/package.py unpack --target "android-$env:ARCH" --output $engine
                  if ($LASTEXITCODE -ne 0) { throw "Engine validation failed: $env:ABI" }
                  $apk = "build/release-apks/$env:APK"
                  python tool/engine/frame_plan/build_apk.py --mode release --abi $env:ABI --flutter-sdk $env:FLUTTER_ROOT --android-sdk $env:ANDROID_HOME --engine-library "$engine/libflutter.so" --skip-pub-get --skip-patch --output $apk @defines
                  if ($LASTEXITCODE -ne 0) {
                    $buildLog = [IO.Path]::ChangeExtension($apk, '.build.log')
                    if (Test-Path -LiteralPath $buildLog) { Get-Content -LiteralPath $buildLog -Tail 200 }
                    throw "APK assembly failed: $env:ABI"
                  }

            - name: Upload Android build logs
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  if-no-files-found: ignore
                  name: android-build-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.abi }}
                  path: build/release-apks/*.build.log

            - name: Upload signed APK
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  overwrite: true
                  name: ${{ env.APK }}
                  path: build/release-apks/${{ env.APK }}

    windows:
        needs: prepare
        name: Release Windows x64
        if: ${{ inputs.build_win_x64 }}
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Write version and build info
              shell: pwsh
              env:
                  RELEASE_VERSION: ${{ inputs.tag }}
                  RELEASE_METADATA: ${{ needs.prepare.outputs.json }}
              run: |
                  $metadata = $env:RELEASE_METADATA | ConvertFrom-Json -AsHashtable
                  lib/scripts/build.ps1 -Version $env:RELEASE_VERSION -BuildTime $metadata['pili.time']

            - uses: ./.github/actions/prepare-release
              with:
                  platform: windows

            - name: Cache WebView NuGet packages
              uses: actions/cache@v5
              with:
                path: build/windows/x64/packages
                key: windows-x64-webview-${{ hashFiles('third_party/flutter_inappwebview_windows/windows/CMakeLists.txt') }}

            - name: Install fastforge
              run: dart pub global activate fastforge

            - uses: ./.github/actions/setup-inno

            - name: Set up Python for native package verification
              uses: actions/setup-python@v6
              with:
                  python-version-file: .python-version

            - name: Cache verified Windows libmpv archive
              uses: actions/cache@v5
              with:
                  path: build/upstream-mpv/*.7z
                  key: windows-x64-libmpv-${{ hashFiles('third_party/media_kit_libs_windows_video/windows/libmpv.json') }}

            - name: Verify prebuilt libmpv
              shell: pwsh
              run: python tool/verify_libmpv.py --backward-seek

            - name: Verify prebuilt cnativeapi
              shell: pwsh
              run: python third_party/nativeapi/package.py verify

            - name: Build Windows release with verified prebuilt engine
              shell: pwsh
              env:
                  CMAKE_BUILD_PARALLEL_LEVEL: "4"
              run: |
                $ErrorActionPreference = 'Stop'
                $configuration = python third_party/flutter_engine/package.py unpack --target windows-x64 --output build/prebuilt-engine/windows-x64
                if ($LASTEXITCODE -ne 0) { throw 'Windows engine validation failed' }
                $configuration | Set-Content build/windows-engine-config.json -Encoding utf8NoBOM
                $defines = @(($configuration | ConvertFrom-Json).dartDefines | ForEach-Object { "--build-dart-define=$_" })
                fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean @defines --hook-pre "python tool/packaging/prepare_windows_package.py --runtime build/windows/x64/runner/Release"
                if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
                $expected = ($configuration | ConvertFrom-Json).identity.binarySha256
                $actual = (Get-FileHash build/windows/x64/runner/Release/flutter_windows.dll -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) { throw 'Packaged Windows engine differs from verified artifact' }

            - name: Package Windows portable and installer
              shell: pwsh
              run: |
                $ErrorActionPreference = "Stop"
                $portable = "PiliAuroraNext_windows_$($env:version)_x64"
                $setupDir = "PiliAuroraNext-Win-Setup"

                $releaseDir = "build/windows/x64/runner/Release"
                if (-not (Test-Path "$releaseDir/PiliAuroraNext.exe")) {
                  throw "Portable build output is incomplete: $releaseDir/PiliAuroraNext.exe not found"
                }
                New-Item -ItemType Directory -Path $portable -Force | Out-Null
                Move-Item "$releaseDir/*" $portable -Force
                Write-Host "Portable folder: $portable"

                Write-Host "dist directory:"
                if (Test-Path dist) { Get-ChildItem dist -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" } }

                New-Item -ItemType Directory -Path $setupDir -Force | Out-Null
                if (-not (Test-Path dist)) {
                  throw "The Windows installer was not produced: dist directory does not exist"
                }
                $installers = @(Get-ChildItem -Path "dist" -Filter *.exe -File -Recurse)
                if ($installers.Count -ne 1) {
                  $found = if ($installers.Count) { ($installers.FullName -join ', ') } else { 'none' }
                  throw "Expected exactly one installer in dist, found $($installers.Count): $found"
                }
                $setup = Join-Path $setupDir "${portable}_setup.exe"
                Move-Item $installers[0].FullName $setup -Force
                Write-Host "Installer: $setup"

            - name: Compress Windows portable
              shell: pwsh
              run: |
                $ErrorActionPreference = "Stop"
                $portable = "PiliAuroraNext_windows_$($env:version)_x64"
                Compress-Archive -Path $portable -DestinationPath "${portable}_portable.zip"

            - name: Upload Windows portable
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  overwrite: true
                  name: PiliAuroraNext_windows_${{ env.version }}_x64_portable.zip
                  path: PiliAuroraNext_windows_${{ env.version }}_x64_portable.zip

            - name: Upload Windows setup
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  if-no-files-found: error
                  overwrite: true
                  name: PiliAuroraNext_windows_${{ env.version }}_x64_setup.exe
                  path: PiliAuroraNext-Win-Setup/PiliAuroraNext_windows_${{ env.version }}_x64_setup.exe

    publish:
        name: Publish verified release
        needs: [prepare, android, windows, linux_tests, windows_tests]
        if: >-
            ${{ !cancelled() && inputs.tag != '' && needs.prepare.result == 'success'
                && (!inputs.build_android || (needs.android.result == 'success'
                    && (inputs.skip_ci_tests || needs.linux_tests.result == 'success')))
                && (!inputs.build_win_x64 || (needs.windows.result == 'success'
                    && (inputs.skip_ci_tests || needs.windows_tests.result == 'success'))) }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download release assets
              uses: actions/download-artifact@v8
              with:
                  pattern: PiliAuroraNext_*
                  path: release
                  merge-multiple: true
                  skip-decompress: true

            - name: Require every selected release asset
              shell: pwsh
              env:
                  VERSION: ${{ needs.prepare.outputs.version }}
                  BUILD_ANDROID: ${{ inputs.build_android }}
                  BUILD_WINDOWS: ${{ inputs.build_win_x64 }}
              run: |
                  $expected = @()
                  if ($env:BUILD_ANDROID -eq 'true') {
                    $expected += @('armeabi-v7a', 'arm64-v8a', 'x86_64') | ForEach-Object {
                      "PiliAuroraNext_android_$($env:VERSION)_$_.apk"
                    }
                  }
                  if ($env:BUILD_WINDOWS -eq 'true') {
                    $expected += "PiliAuroraNext_windows_$($env:VERSION)_x64_portable.zip"
                    $expected += "PiliAuroraNext_windows_$($env:VERSION)_x64_setup.exe"
                  }
                  $files = @(Get-ChildItem -LiteralPath release -File)
                  if ($files.Count -ne $expected.Count -or (Compare-Object $expected $files.Name -CaseSensitive)) {
                    throw "Unexpected release assets. Expected: $($expected -join ', '); found: $($files.Name -join ', ')"
                  }

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ inputs.tag }}
                  name: ${{ inputs.tag }}
                  generate_release_notes: true
                  draft: ${{ inputs.draft_release }}
                  prerelease: ${{ inputs.prerelease }}
                  fail_on_unmatched_files: true
                  files: release/*
