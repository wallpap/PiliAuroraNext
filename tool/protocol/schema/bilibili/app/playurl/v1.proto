syntax = "proto3";

package bilibili.app.playurl.v1;

enum Business {
  UNKNOWN = 0;
  STORY = 1;
}

enum ButtonAction {
  BUTTON_UNKNOWN = 0;
  CHARGINGPLUS = 1;
}

enum CodeType {
  NOCODE = 0;
  CODE264 = 1;
  CODE265 = 2;
  CODEAV1 = 3;
}

enum ConfType {
  NoType = 0;
  FLIPCONF = 1;
  CASTCONF = 2;
  FEEDBACK = 3;
  SUBTITLE = 4;
  PLAYBACKRATE = 5;
  TIMEUP = 6;
  PLAYBACKMODE = 7;
  SCALEMODE = 8;
  BACKGROUNDPLAY = 9;
  LIKE = 10;
  DISLIKE = 11;
  COIN = 12;
  ELEC = 13;
  SHARE = 14;
  SCREENSHOT = 15;
  LOCKSCREEN = 16;
  RECOMMEND = 17;
  PLAYBACKSPEED = 18;
  DEFINITION = 19;
  SELECTIONS = 20;
  NEXT = 21;
  EDITDM = 22;
  SMALLWINDOW = 23;
  SHAKE = 24;
  OUTERDM = 25;
  INNERDM = 26;
  PANORAMA = 27;
  DOLBY = 28;
  COLORFILTER = 29;
  LOSSLESS = 30;
}

enum Group {
  UnknownGroup = 0;
  A = 1;
  B = 2;
  C = 3;
}

enum GuideStyle {
  STYLE_UNKNOWN = 0;
  CHARGING_TEXT = 1;
}

enum PlayErr {
  NoErr = 0;
  WithMultiDeviceLoginErr = 1;
}

enum PlayLimitCode {
  PLCUnkown = 0;
  PLCUgcNotPayed = 1;
  PLCChargingPlusNotPass = 2;
  PLCChargingPlusUpgrade = 3;
}

enum ToastType {
  TOAST_TYPE_UNKNOWN = 0;
  CHARGING_TOAST = 1;
}

enum VideoType {
  Unknown = 0;
  FLV = 1;
  DASH = 2;
  MP4 = 3;
}

message AB {
  .bilibili.app.playurl.v1.Glance glance = 1;
  .bilibili.app.playurl.v1.Group group = 2;
}

message ArcConf {
  bool is_support = 1;
  bool disabled = 2;
  .bilibili.app.playurl.v1.ExtraContent extra_content = 3;
  repeated int64 unsupport_scene = 4;
}

message ButtonInfo {
  string text = 1;
  string text_color = 2;
  string text_color_night = 3;
  string bg_color = 4;
  string bg_color_night = 5;
  string link = 6;
  .bilibili.app.playurl.v1.ButtonAction action_type = 7;
  .bilibili.app.playurl.v1.Report report = 8;
  string frame_color = 9;
  string icon = 10;
}

message ButtonStyle {
  string text = 1;
  string text_color = 2;
  string bg_color = 3;
  string jump_link = 4;
}

message Chronos {
  string md5 = 1;
  string file = 2;
}

message CloudConf {
  bool show = 1;
  .bilibili.app.playurl.v1.ConfType conf_type = 2;
  .bilibili.app.playurl.v1.FieldValue field_value = 3;
  .bilibili.app.playurl.v1.ConfValue conf_value = 4;
}

message ComprehensiveToast {
  .bilibili.app.playurl.v1.ToastType type = 1;
  .bilibili.app.playurl.v1.ButtonInfo button = 2;
  string icon = 3;
  .bilibili.app.playurl.v1.TextInfo toast_text = 4;
  .bilibili.app.playurl.v1.Report report = 5;
}

message ConfValue {
  oneof value {
    bool switch_val = 1;
    int64 selected_val = 2;
  }
}

message DashItem {
  int32 id = 1;
  string base_url = 2;
  repeated string backup_url = 3;
  int32 bandwidth = 4;
  int32 codecid = 5;
  string md5 = 6;
  int64 size = 7;
  string frame_rate = 8;
  string widevine_pssh = 9;
  string bilidrm_uri = 10;
}

message DashVideo {
  string base_url = 1;
  repeated string backup_url = 2;
  int32 bandwidth = 3;
  int32 codecid = 4;
  string md5 = 5;
  int64 size = 6;
  int32 audio_id = 7;
  bool no_rexcode = 8;
  string frame_rate = 9;
  int32 width = 10;
  int32 height = 11;
  string widevine_pssh = 12;
  string bilidrm_uri = 13;
}

message Dialog {
  .bilibili.app.playurl.v1.GuideStyle style_type = 1;
  .bilibili.app.playurl.v1.Report report = 2;
  .bilibili.app.playurl.v1.TextInfo title = 3;
  .bilibili.app.playurl.v1.TextInfo subtitle = 4;
  repeated .bilibili.app.playurl.v1.ButtonInfo button = 5;
}

message DolbyItem {
  enum Type {
    NONE = 0;
    COMMON = 1;
    ATMOS = 2;
  }
  .bilibili.app.playurl.v1.DolbyItem.Type type = 1;
  repeated .bilibili.app.playurl.v1.DashItem audio = 2;
}

message Event {
  .bilibili.app.playurl.v1.Shake shake = 1;
}

message ExtraContent {
  string disabled_reason = 1;
  int64 disabled_code = 2;
}

message FieldValue {
  oneof value {
    bool switch = 1;
  }
}

message FormatDescription {
  int32 quality = 1;
  string format = 2;
  string description = 3;
  string new_description = 4;
  string display_desc = 5;
  string superscript = 6;
}

message Glance {
  bool can_watch = 1;
  int64 times = 2;
  int64 duration = 3;
}

message LossLessItem {
  bool is_lossless_audio = 1;
  .bilibili.app.playurl.v1.DashItem audio = 2;
  bool need_vip = 3;
}

message MultiDashVideo {
  repeated .bilibili.app.playurl.v1.DashVideo dash_videos = 1;
}

message PlayAbilityConf {
  .bilibili.app.playurl.v1.CloudConf background_play_conf = 1;
  .bilibili.app.playurl.v1.CloudConf flip_conf = 2;
  .bilibili.app.playurl.v1.CloudConf cast_conf = 3;
