message PlayConfEditReply {
}

message PlayConfEditReq {
  repeated .bilibili.app.playurl.v1.PlayConfState play_conf = 1;
}

message PlayConfReply {
  .bilibili.app.playurl.v1.PlayAbilityConf play_conf = 1;
}

message PlayConfReq {
}

message PlayConfState {
  .bilibili.app.playurl.v1.ConfType conf_type = 1;
  bool show = 2;
  .bilibili.app.playurl.v1.FieldValue field_value = 3;
  .bilibili.app.playurl.v1.ConfValue conf_value = 4;
}

message PlayLimit {
  .bilibili.app.playurl.v1.PlayLimitCode code = 1;
  string message = 2;
  string sub_message = 3;
  .bilibili.app.playurl.v1.ButtonStyle button = 4;
}

message PlayURLReply {
  int32 quality = 1;
  string format = 2;
  int64 timelength = 3;
  int32 video_codecid = 4;
  int32 fnver = 5;
  int32 fnval = 6;
  bool video_project = 7;
  repeated .bilibili.app.playurl.v1.ResponseUrl durl = 8;
  .bilibili.app.playurl.v1.ResponseDash dash = 9;
  int32 no_rexcode = 10;
  .bilibili.app.playurl.v1.UpgradeLimit upgrade_limit = 11;
  repeated .bilibili.app.playurl.v1.FormatDescription support_formats = 12;
  .bilibili.app.playurl.v1.VideoType type = 13;
  .bilibili.app.playurl.v1.VipRisk vip_risk = 14;
}

message PlayURLReq {
  int64 aid = 1;
  int64 cid = 2;
  int64 qn = 3;
  int32 fnver = 4;
  int32 fnval = 5;
  int32 download = 6;
  int32 force_host = 7;
  bool fourk = 8;
  string spmid = 9;
  string from_spmid = 10;
}

message PlayViewReply {
  .bilibili.app.playurl.v1.VideoInfo video_info = 1;
  .bilibili.app.playurl.v1.PlayAbilityConf play_conf = 2;
  .bilibili.app.playurl.v1.UpgradeLimit upgrade_limit = 3;
  .bilibili.app.playurl.v1.Chronos chronos = 4;
  .bilibili.app.playurl.v1.PlayArcConf play_arc = 5;
  .bilibili.app.playurl.v1.Event event = 6;
  .bilibili.app.playurl.v1.AB ab = 7;
  .bilibili.app.playurl.v1.PlayLimit play_limit = 8;
  .bilibili.app.playurl.v1.ViewInfo view_info = 9;
  .bilibili.app.playurl.v1.PlayArc arc = 10;
}

message PlayViewReq {
  int64 aid = 1;
  int64 cid = 2;
  int64 qn = 3;
  int32 fnver = 4;
  int32 fnval = 5;
  int32 download = 6;
  int32 force_host = 7;
  bool fourk = 8;
  string spmid = 9;
  string from_spmid = 10;
  int32 teenagers_mode = 11;
  .bilibili.app.playurl.v1.CodeType prefer_codec_type = 12;
  .bilibili.app.playurl.v1.Business business = 13;
  int64 voice_balance = 14;
}

message ProjectReply {
  .bilibili.app.playurl.v1.PlayURLReply project = 1;
}

message ProjectReq {
  int64 aid = 1;
  int64 cid = 2;
  int64 qn = 3;
  int32 fnver = 4;
  int32 fnval = 5;
  int32 download = 6;
  int32 force_host = 7;
  bool fourk = 8;
  string spmid = 9;
  string from_spmid = 10;
  int32 protocol = 11;
  int32 device_type = 12;
}

message PromptBar {
  .bilibili.app.playurl.v1.TextInfo title = 1;
  .bilibili.app.playurl.v1.TextInfo sub_title = 2;
  string sub_title_icon = 3;
  string bg_image = 4;
  repeated .bilibili.app.playurl.v1.ButtonInfo button = 5;
  .bilibili.app.playurl.v1.Report report = 6;
}

message Report {
  string show_event_id = 1;
  string click_event_id = 2;
  string extends = 3;
}

message ResponseDash {
  repeated .bilibili.app.playurl.v1.DashItem video = 1;
  repeated .bilibili.app.playurl.v1.DashItem audio = 2;
}

message ResponseUrl {
  int32 order = 1;
  int64 length = 2;
  int64 size = 3;
  string url = 4;
  repeated string backup_url = 5;
  string md5 = 6;
  int32 quality = 7;
}

message Scheme {
  enum ActionType {
    UNKNOWN_ActionType = 0;
    SHOW_TOAST = 1;
  }
  .bilibili.app.playurl.v1.Scheme.ActionType action_type = 1;
  string toast = 2;
}

message SegmentVideo {
  repeated .bilibili.app.playurl.v1.ResponseUrl segment = 1;
}

message Shake {
  string file = 1;
}

message Stream {
  oneof content {
    .bilibili.app.playurl.v1.DashVideo dash_video = 2;
    .bilibili.app.playurl.v1.SegmentVideo segment_video = 3;
    .bilibili.app.playurl.v1.MultiDashVideo multi_dash_video = 4;
  }
  .bilibili.app.playurl.v1.StreamInfo stream_info = 1;
}

message StreamInfo {
  int32 quality = 1;
  string format = 2;
  string description = 3;
  .bilibili.app.playurl.v1.PlayErr err_code = 4;
  .bilibili.app.playurl.v1.StreamLimit limit = 5;
  bool need_vip = 6;
  bool need_login = 7;
  bool intact = 8;
  bool no_rexcode = 9;
  int64 attribute = 10;
  string new_description = 11;
  string display_desc = 12;
  string superscript = 13;
  bool vip_free = 14;
  string subtitle = 15;
  .bilibili.app.playurl.v1.Scheme scheme = 16;
  bool support_drm = 17;
  bool has_preview = 18;
}

message StreamLimit {
  string title = 1;
  string uri = 2;
  string msg = 3;
}

message TextInfo {
  string text = 1;
  string text_color = 2;
  string text_color_night = 3;
}

message UpgradeButton {
  string title = 1;
  string link = 2;
}

message UpgradeLimit {
  int32 code = 1;
  string message = 2;
  string image = 3;
  .bilibili.app.playurl.v1.UpgradeButton button = 4;
}

message VideoInfo {
  int32 quality = 1;
  string format = 2;
  int64 timelength = 3;
  int32 video_codecid = 4;
  repeated .bilibili.app.playurl.v1.Stream stream_list = 5;
  repeated .bilibili.app.playurl.v1.DashItem dash_audio = 6;
  .bilibili.app.playurl.v1.DolbyItem dolby = 7;
  .bilibili.app.playurl.v1.VolumeInfo volume = 8;
  .bilibili.app.playurl.v1.LossLessItem loss_less_item = 9;
  int64 main_timelength = 10;
}

message ViewInfo {
  map<string, .bilibili.app.playurl.v1.Dialog> dialog_map = 1;
  .bilibili.app.playurl.v1.PromptBar prompt_bar = 2;
  repeated .bilibili.app.playurl.v1.ComprehensiveToast toasts = 3;
}

message VipRisk {
  bool allow = 1;
  int64 type = 2;
  int64 reason = 3;
  int64 device_status = 4;
}

message VolumeInfo {
  double measured_i = 1;
  double measured_lra = 2;
  double measured_tp = 3;
  double measured_threshold = 4;
  double target_offset = 5;
  double target_i = 6;
  double target_tp = 7;
  map<string, string> multi_scene_args = 8;
}
