syntax = "proto3";

package bilibili.account.service.v1;

enum RenderSchemeEnum {
  Default = 0;
  Colorful = 1;
}

message Color {
  string color_day = 1;
  string color_night = 2;
}

message ColorsInfo {
  repeated int64 color_ids = 1;
  repeated .bilibili.account.service.v1.Color color = 2;
}

message NameRender {
  .bilibili.account.service.v1.RenderSchemeEnum render_scheme = 1;
  .bilibili.account.service.v1.ColorsInfo colors_info = 2;
}
